[pytest]
# Tests import modules as `vein_module.src.x` / `infection_module.src.x`, so the
# repo root must be on sys.path. Backend has its own pytest.ini (rootdir
# backend/) because it imports as `app.x` inside its own venv.
pythonpath = .
# risk_model/temporal_tracker import as infection_module.src.*, so the repo
# root must be importable when pytest is invoked from anywhere.
testpaths = vein_module/tests infection_module/tests
filterwarnings =
    ignore::DeprecationWarning
